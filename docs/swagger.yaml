basePath: /
definitions:
  dto.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  dto.CreateOrUpdatePostRequest:
    properties:
      content:
        type: string
      title:
        type: string
    required:
    - content
    - title
    type: object
  dto.CreateOrUpdatePostResponse:
    properties:
      id:
        type: integer
    type: object
  dto.DetailPostResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/dto.Comment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  dto.GetAllPostResponse:
    properties:
      current_page:
        type: integer
      data:
        items:
          $ref: '#/definitions/dto.DetailPostResponse'
        type: array
      limit:
        type: integer
      total_page:
        type: integer
    type: object
  dto.LikeOrUnlikeCommentRequest:
    properties:
      comment_id:
        type: integer
    required:
    - comment_id
    type: object
  dto.LikeOrUnlikePostRequest:
    properties:
      post_id:
        type: integer
    required:
    - post_id
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      refresh_token:
        type: string
      token:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResponse:
    properties:
      refresh_token:
        type: string
      token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      password_confirm:
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - password
    - password_confirm
    - username
    type: object
  dto.RegisterResponse:
    properties:
      id:
        type: integer
    type: object
  dto.StoreCommentRequest:
    properties:
      content:
        type: string
      post_id:
        type: integer
    required:
    - content
    - post_id
    type: object
host: localhost:8080
info:
  contact:
    email: hi@devbercerita.local
    name: DevBercerita Team
  description: 'API untuk platform DevBercerita: register/login, posting, dan komentar.'
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: DevBercerita API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify email and password to issue JWT access and refresh tokens.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      summary: Login to an existing account
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange an existing refresh token (via Authorization header) for
        new tokens.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Refresh session tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create an account with email, username, and password credentials.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      summary: Register a new user
      tags:
      - Auth
  /comments:
    post:
      consumes:
      - application/json
      parameters:
      - description: Comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StoreCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Create a comment
      tags:
      - Comments
  /comments/action:
    post:
      consumes:
      - application/json
      parameters:
      - description: Comment like payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LikeOrUnlikeCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Like or unlike a comment
      tags:
      - Comments
  /posts:
    get:
      description: Returns paginated posts with default limit 10 and page 1.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetAllPostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      summary: List posts
      tags:
      - Posts
    post:
      consumes:
      - application/json
      description: Authenticated user can create a new post with title and content.
      parameters:
      - description: Post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrUpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateOrUpdatePostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Create a post
      tags:
      - Posts
  /posts/{post_id}/delete:
    delete:
      description: Delete a post that belongs to the calling user.
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Posts
  /posts/{post_id}/detail:
    get:
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DetailPostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      summary: Get post detail
      tags:
      - Posts
  /posts/{post_id}/update:
    put:
      consumes:
      - application/json
      description: Update the title or content of an owned post.
      parameters:
      - description: Post ID
        in: path
        name: post_id
        required: true
        type: integer
      - description: Updated post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrUpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateOrUpdatePostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - Posts
  /posts/action:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post like payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LikeOrUnlikePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.MessageResponse'
      security:
      - BearerAuth: []
      summary: Like or unlike a post
      tags:
      - Posts
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
